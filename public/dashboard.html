<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Мои ссылки</h1>
        <button onclick="logout()">Выйти</button>

        <!-- Создание ссылки -->
        <div class="create-link">
            <input type="url" id="original-url" placeholder="https://example.com" required>
            <button onclick="createLink()">Создать короткую ссылку</button>
            <p class="error" id="create-error"></p>
        </div>

        <!-- Результат создания -->
        <div id="new-link" class="hidden">
            <p>Короткая ссылка: <a id="short-url" href="#" target="_blank"></a></p>
        </div>

        <!-- Список ссылок -->
        <h2>Список ссылок</h2>
        <table id="links-table">
            <thead>
                <tr>
                    <th>Короткий код</th>
                    <th>Оригинальный URL</th>
                    <th>Короткая ссылка</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="links-body"></tbody>
        </table>
    </div>

    <!-- Статистика -->
    <div id="stats-modal" class="hidden">
        <h2>Статистика</h2>
        <div id="stats-content"></div>
        <button onclick="closeStats()">Закрыть</button>
    </div>

    <script src="/dashboard.js"></script>
</body>
</html>
